[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "match-prediction-engine"
version = "2.0.0"
description = "Multi-sport quantitative probability modeling, value betting (+EV), and accumulator anchor prediction engine with zero paid APIs."
readme = "README.md"
authors = [
    { name = "Solomon", email = "icecool30@users.noreply.github.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Other/Nonlisted Topic",
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
match-predict = "scripts.poisson_model:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0"
]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.pytest.ini_options]
testpaths = ["tests"]
